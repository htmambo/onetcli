  client_channel_closed:
    en: "host client channel closed."
    zh-CN: "host client 通道已关闭。"
    zh-HK: "host client 通道已關閉。"
  spawn_response_timeout:
    en: "Timed out waiting for Spawned response."
    zh-CN: "等待 Spawned 响应超时。"
    zh-HK: "等待 Spawned 回應逾時。"
  attach_response_timeout:
    en: "Timed out waiting for Attached response."
