    zh-CN: "写入 host pid 文件失败。"
    zh-HK: "寫入 host pid 檔案失敗。"
  open_pty_failed:
    en: "Failed to open PTY."
    zh-CN: "打开 PTY 失败。"
    zh-HK: "開啟 PTY 失敗。"
  spawn_shell_failed:
    en: "Failed to spawn shell in PTY."
    zh-CN: "在 PTY 中启动 shell 失败。"
    zh-HK: "在 PTY 中啟動 shell 失敗。"
  pty_master_writer_failed:
    en: "Failed to obtain PTY master writer."
    zh-CN: "获取 PTY master writer 失败。"
    zh-HK: "取得 PTY master writer 失敗。"
  pty_master_reader_failed:
    en: "Failed to obtain PTY master reader."
    zh-CN: "获取 PTY master reader 失败。"
    zh-HK: "取得 PTY master reader 失敗。"
  starting_subprocess:
