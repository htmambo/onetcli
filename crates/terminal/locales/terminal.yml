_version: 2

SshSession:
  key_changed_hint:
    en: "SSH host key has changed. You can enable 'Auto-accept new SSH keys' in Settings > General > SSH Security, then reconnect."
    zh-CN: "SSH 服务器密钥已变更。您可以在 设置 > 通用 > SSH 安全 中开启\"自动接受新密钥\"，然后重新连接。"
    zh-HK: "SSH 伺服器密鑰已變更。您可以在 設定 > 一般 > SSH 安全 中開啟\"自動接受新密鑰\"，然後重新連接。"
  key_change_fingerprints:
    en: "Old fingerprint: %{old_fingerprint}\nNew fingerprint: %{new_fingerprint}\nVerify carefully before accepting the new key."
    zh-CN: "旧指纹：%{old_fingerprint}\n新指纹：%{new_fingerprint}\n接受前请仔细核对。"
    zh-HK: "舊指紋：%{old_fingerprint}\n新指紋：%{new_fingerprint}\n接受前請仔細核對。"
  unknown_host_fingerprint:
    en: "This host is not in known_hosts yet.\nFingerprint: %{fingerprint}\nVerify it carefully, then click 'Trust new host and connect'."
    zh-CN: "该主机尚未写入 known_hosts。\n指纹：%{fingerprint}\n请仔细核对后点击\"信任新主机并连接\"。"
    zh-HK: "該主機尚未寫入 known_hosts。\n指紋：%{fingerprint}\n請仔細核對後點擊\"信任新主機並連接\"。"

SshBackend:
  channel_open_rejected_max_sessions:
    en: "Server refused to open a new channel. This may be the MaxSessions limit (try raising it on the SSH server)."
    zh-CN: "服务器拒绝打开新 channel，可能是 MaxSessions 限制（可尝试在 SSH server 设置更大值）。"
    zh-HK: "伺服器拒絕開啟新 channel，可能是 MaxSessions 限制（可嘗試在 SSH server 設定更大值）。"
  connect_timeout_hint:
    en: "Connection timed out. Check network, proxy, or jump host reachability."
    zh-CN: "连接超时，检查网络/代理/跳板机可达性。"
    zh-HK: "連線逾時，檢查網路/代理/跳板機可達性。"
  channel_open_retry_max_sessions:
    en: "channel open failed, invalidating and retrying once (possible MaxSessions limit)."
    zh-CN: "channel open 失败，尝试 invalidate 并重连一次（可能是 MaxSessions 限制）。"
    zh-HK: "channel open 失敗，嘗試 invalidate 並重連一次（可能是 MaxSessions 限制）。"
  trust_no_pending_key:
    en: "trust_new_host_and_reconnect: %{host}:%{port} has no pending host key to trust."
    zh-CN: "trust_new_host_and_reconnect: %{host}:%{port} 没有待信任的主机密钥。"
    zh-HK: "trust_new_host_and_reconnect: %{host}:%{port} 沒有待信任的主機密鑰。"
  trust_write_known_hosts_failed:
    en: "Trusting new host %{host}:%{port} failed to write known_hosts: %{error}."
    zh-CN: "信任新主机 %{host}:%{port} 写入 known_hosts 失败: %{error}。"
    zh-HK: "信任新主機 %{host}:%{port} 寫入 known_hosts 失敗: %{error}。"

ShellIntegration:
  install_channel_open_failed:
    en: "Failed to open the shell integration install channel. Falling back to no-integration mode."
    zh-CN: "打开 shell integration 安装通道失败，降级为无 integration 模式。"
    zh-HK: "開啟 shell integration 安裝通道失敗，降級為無 integration 模式。"
  install_timeout:
    en: "shell integration install timed out. Falling back to no-integration mode."
    zh-CN: "shell integration 安装超时，降级为无 integration 模式。"
    zh-HK: "shell integration 安裝逾時，降級為無 integration 模式。"
  ssh_detect_timeout_disable_process_check:
    en: "SSH shell integration was not detected (timeout %{seconds}s). Disabling process check to avoid false positives."
    zh-CN: "SSH shell integration 未检测到（超时 %{seconds} 秒），禁用进程检查以避免误报。"
    zh-HK: "SSH shell integration 未偵測到（逾時 %{seconds} 秒），停用行程檢查以避免誤報。"
  skip_temp_dir_failed:
    en: "Could not create temp directory %{dir}; skipping Shell Integration."
    zh-CN: "无法创建临时目录 %{dir}，跳过 Shell Integration。"
    zh-HK: "無法建立臨時目錄 %{dir}，跳過 Shell Integration。"
  write_script_failed:
    en: "Failed to write shell_integration.sh: %{error}."
    zh-CN: "写入 shell_integration.sh 失败: %{error}。"
    zh-HK: "寫入 shell_integration.sh 失敗: %{error}。"
  ssh_detect_timeout_disabled:
    en: "SSH shell integration detection timed out; process check disabled."
    zh-CN: "SSH shell integration 检测超时，已禁用进程检查。"
    zh-HK: "SSH shell integration 偵測逾時，已停用行程檢查。"

Connection:
  ssh_connected_synced_size:
    en: "SSH connected, syncing terminal size to remote: %{cols}x%{rows}."
    zh-CN: "SSH 连接成功，同步终端尺寸到远程: %{cols}x%{rows}。"
    zh-HK: "SSH 連線成功，同步終端尺寸到遠端: %{cols}x%{rows}。"

LocalPtyHost:
  clone_unix_stream_failed:
