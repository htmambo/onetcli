_version: 2

# Shell Integration
ShellIntegration:
  history_restored:
    en: "\r\n\r\n\x1b[30;47m * \x1b[0m\x1b[97;100m History Restored \x1b[0m\r\n\r\n"
    zh-CN: "\r\n\r\n\x1b[30;47m * \x1b[0m\x1b[97;100m 历史记录已恢复 \x1b[0m\r\n\r\n"
    zh-HK: "\r\n\r\n\x1b[30;47m * \x1b[0m\x1b[97;100m 歷史記錄已恢復 \x1b[0m\r\n\r\n"
  history_restored_brief:
    en: "History Restored"
    zh-CN: "历史记录已恢复"
    zh-HK: "歷史記錄已恢復"
  temp_dir_failed:
    en: "Failed to create temp dir {path}, skipping Shell Integration"
    zh-CN: "无法创建临时目录 {path}，跳过 Shell Integration"
    zh-HK: "無法創建臨時目錄 {path}，跳過 Shell Integration"
  write_script_failed:
    en: "Failed to write shell_integration.sh: {error}"
    zh-CN: "写入 shell_integration.sh 失败: {error}"
    zh-HK: "寫入 shell_integration.sh 失敗: {error}"
  zsh_configured:
    en: "Configured zsh Shell Integration (ZDOTDIR={zd})"
    zh-CN: "已配置 zsh Shell Integration (ZDOTDIR={zd})"
    zh-HK: "已配置 zsh Shell Integration (ZDOTDIR={zd})"
  bash_configured:
    en: "Configured bash Shell Integration (--rcfile={rc})"
    zh-CN: "已配置 bash Shell Integration (--rcfile={rc})"
    zh-HK: "已配置 bash Shell Integration (--rcfile={rc})"
  unknown_shell:
    en: "Unknown shell type '{shell}', skipping Shell Integration injection"
    zh-CN: "未知 shell 类型 '{shell}'，跳过 Shell Integration 注入"
    zh-HK: "未知 shell 類型 '{shell}'，跳過 Shell Integration 注入"

