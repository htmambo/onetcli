    zh-CN: "绑定 Unix Domain Socket 失败: %{endpoint}。"
    zh-HK: "綁定 Unix Domain Socket 失敗: %{endpoint}。"
  unix_listener_started:
    en: "local-pty-host Unix listener started."
    zh-CN: "local-pty-host Unix listener 已启动。"
    zh-HK: "local-pty-host Unix listener 已啟動。"
  windows_listener_started:
    en: "local-pty-host Windows listener started."
    zh-CN: "local-pty-host Windows listener 已启动。"
    zh-HK: "local-pty-host Windows listener 已啟動。"
  accept_client_failed:
    en: "Failed to accept client connection."
    zh-CN: "接受 client 连接失败。"
    zh-HK: "接受 client 連線失敗。"
  named_pipe_path_invalid:
    en: "Invalid named pipe path."
    zh-CN: "无效的 named pipe 路径。"
    zh-HK: "無效的 named pipe 路徑。"
  named_pipe_create_failed:
    en: "Failed to create Windows Named Pipe Server."
    zh-CN: "创建 Windows Named Pipe Server 失败。"
    zh-HK: "建立 Windows Named Pipe Server 失敗。"
  named_pipe_next_create_failed:
    en: "Failed to create next Windows Named Pipe Server."
    zh-CN: "创建下一个 Windows Named Pipe Server 失败。"
    zh-HK: "建立下一個 Windows Named Pipe Server 失敗。"
  connect_failed:
    en: "Failed to connect to local-pty-host."
    zh-CN: "连接 local-pty-host 失败。"
    zh-HK: "連線 local-pty-host 失敗。"
  hosted_spawn_failed:
    en: "Hosted local PTY spawn failed."
    zh-CN: "hosted local PTY spawn 失败。"
    zh-HK: "hosted local PTY spawn 失敗。"
  hosted_attach_failed:
    en: "Hosted local PTY attach failed."
    zh-CN: "hosted local PTY attach 失败。"
    zh-HK: "hosted local PTY attach 失敗。"
  runtime_dir_hardening_fallback:
    en: "Runtime directory hardening failed; continuing with default path (connections will fail naturally): %{error}."
    zh-CN: "运行时目录加固失败，按默认路径继续（连接将自然失败）: %{error}。"
    zh-HK: "執行時目錄加固失敗，按預設路徑繼續（連線將自然失敗）: %{error}。"
  runtime_dir_hardening_default_path:
    en: "Runtime directory hardening failed; continuing with default path: %{error}."
    zh-CN: "运行时目录加固失败，按默认路径继续: %{error}。"
    zh-HK: "執行時目錄加固失敗，按預設路徑繼續: %{error}。"

