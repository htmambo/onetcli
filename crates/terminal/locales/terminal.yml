    zh-CN: "启动本地 PTY host 子进程。"
    zh-HK: "啟動本地 PTY host 子行程。"
  detached_session_ttl_cleanup:
    en: "Detached session TTL expired; running cleanup."
    zh-CN: "detached session TTL 到期，执行清理。"
    zh-HK: "detached session TTL 到期，執行清理。"
  runtime_dir_hardening_failed:
    en: "Failed to harden local-pty runtime directory (refusing to start to prevent unauthorized access)."
    zh-CN: "local-pty 运行时目录加固失败（拒绝启动，防止越权访问）。"
    zh-HK: "local-pty 執行時目錄加固失敗（拒絕啟動，防止越權存取）。"
  already_running:
