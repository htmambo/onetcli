    zh-CN: 正在通过代理连接目标主机...
    zh-HK: 正在透過代理連接目標主機...
  handshaking_target:
    en: Performing SSH handshake with target host...
    zh-CN: 正在与目标主机进行 SSH 握手...
    zh-HK: 正在與目標主機進行 SSH 握手...
  authenticating_target:
    en: Authenticating target host...
