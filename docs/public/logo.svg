<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变（深灰色，带有边缘暗化效果） -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
    
    <!-- 圆形阴影效果 -->
    <filter id="circleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 边框渐变（高对比，避免缩小时和背景混在一起） -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6e6e6;stop-opacity:0.95" />
      <stop offset="55%" style="stop-color:#8d8d8d;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3a3a3a;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- 主体：圆角矩形（深灰色背景） -->
  <rect x="108" y="108" width="802" height="802" rx="180" ry="180" fill="url(#bgGradient)" />
  
  <!-- 边框渐变效果 -->
  <rect x="108" y="108" width="802" height="802" rx="180" ry="180" fill="none" stroke="url(#borderGradient)" stroke-width="36" />
  <!-- 内层高光边框，保证小尺寸也能看见边框轮廓 -->
  <rect x="150" y="150" width="718" height="718" rx="146" ry="146" fill="none" stroke="#000" stroke-opacity="1" stroke-width="48" />

  <!-- 三个彩色圆形（macOS 风格的窗口控制按钮） -->
  
  <!-- 红色圆 -->
  <circle cx="250" cy="250" r="50" fill="#FF5F56" filter="url(#circleShadow)" />
  <circle cx="250" cy="250" r="45" fill="#FF6B63" />
  
  <!-- 黄色圆 -->
  <circle cx="370" cy="250" r="50" fill="#FFBD2E" filter="url(#circleShadow)" />
  <circle cx="370" cy="250" r="45" fill="#FFCA3A" />
  
  <!-- 绿色圆 -->
  <circle cx="490" cy="250" r="50" fill="#27C93F" filter="url(#circleShadow)" />
  <circle cx="490" cy="250" r="45" fill="#2EC43C" />

  <!-- 文本：su root -->
  <text x="180" y="450" font-family="'Menlo', 'Ubuntu Mono', monospace" font-size="140" font-weight="700" text-anchor="start" fill="white">su root</text>
  
  <!-- 文本：rm -rf / -->
  <text x="180" y="600" font-family="'Menlo', 'Ubuntu Mono', monospace" font-size="140" font-weight="700" text-anchor="start" fill="white">rm -rf /</text>

  <!-- 终端提示符：>_ -->
  <text x="180" y="790" font-family="'Menlo', 'Ubuntu Mono', monospace" font-size="200" font-weight="700" text-anchor="start" fill="green">&gt;_</text>
</svg>
