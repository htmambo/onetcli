<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13DDF4"/>
      <stop offset="100%" stop-color="#2A2580"/>
    </linearGradient>
  </defs>

  <!-- macOS 风格圆角背景，填满整个区域 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- 闪电符号（6 顶点多边形，坐标基于 icns 像素数据精确映射） -->
  <polygon points="199,116 157,232 217,270 77,406 117,294 56,245" fill="#061420"/>

  <!-- 数据库表格（右侧，与闪电并列，淡化处理） -->
  <g opacity="0.4">
    <g fill="none" stroke="#061420" stroke-width="11" stroke-linejoin="round">
      <rect x="246" y="136" width="180" height="188" rx="12"/>
      <line x1="246" y1="189" x2="426" y2="189"/>
      <line x1="246" y1="243" x2="426" y2="243"/>
      <line x1="336" y1="136" x2="336" y2="324"/>
    </g>
    <!-- 表头填充 -->
    <rect x="252" y="142" width="168" height="42" rx="7" fill="#061420"/>
  </g>

  <!-- 横向短横线（终端提示符横线） -->
  <rect x="216" y="362" width="240" height="33" rx="16" fill="#061420"/>
</svg>
