# 主密钥
Encryption:
  edit_repo_password:
    en: Edit Master Key
    zh-CN: 编辑主密钥
    zh-HK: 編輯主密鑰
  set_repo_password:
    en: Set Master Key
    zh-CN: 设置主密钥
